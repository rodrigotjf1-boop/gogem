name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: Lint + typecheck (JS/TS workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  admin:
    name: Admin (React + Vite) — typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm -F @gogem/admin run typecheck

      - name: Build
        run: pnpm -F @gogem/admin run build

      - name: Test
        run: pnpm -F @gogem/admin run test

  kiosk:
    name: Kiosk (Flutter) — analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Testes de widget/unidade não exigem as pastas de plataforma
      # (android/windows são geradas com `flutter create .` na máquina do dev).
      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
