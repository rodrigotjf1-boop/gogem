name: Build APK (totem)

# Gera o APK do totem (app Flutter) sob demanda, sem precisar de SDK Android
# local. Dispare em Actions → "Build APK (totem)" → Run workflow, informando a
# URL da API publicada e um JWT de gestor (temporário, vale ~12h — até o
# pareamento de dispositivo existir). Baixe o APK nos "Artifacts" do run.
#
# Os Tinker Board S são ARM 32-bit → instale o `app-armeabi-v7a-release.apk`.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL base da API (ex.: https://api.gogem.com.br/api/v1)'
        required: true
        default: 'https://api.gogem.com.br/api/v1'
      dev_jwt:
        description: 'OPCIONAL: JWT de gestor p/ pular o pareamento (dev). Em produção deixe VAZIO — o totem pareia no 1º boot (Frota).'
        required: false
        default: ''

jobs:
  apk:
    name: Flutter build apk (release, split-per-abi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk
    steps:
      - uses: actions/checkout@v4

      # Esconde o JWT dos logs (injetado no build via --dart-define). Depois do
      # checkout: o working-directory do job (apps/kiosk) já existe. Pulado
      # quando vazio (produção pareia no 1º boot, sem JWT).
      - name: Mascarar segredo nos logs
        if: ${{ inputs.dev_jwt != '' }}
        run: echo "::add-mask::${{ inputs.dev_jwt }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      # As pastas de plataforma não são versionadas (ver ci.yml): geramos o
      # scaffold Android on-demand. Não toca em lib/ nem em pubspec.
      - name: Gerar projeto Android
        run: flutter create --platforms=android --org br.com.dms .

      # `flutter create` NÃO declara INTERNET no manifesto principal (só nos de
      # debug/profile). Sem isso o APK de release não alcança a API. Injeta a
      # permissão como filha de <manifest>, antes de <application>. E declara o
      # intent-filter USB_DEVICE_ATTACHED + meta-data (device_filter) DENTRO da
      # <activity>, para o Android conceder a permissão da Epson ao plugar.
      - name: Permitir internet + impressora USB (release)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          if ! grep -q 'USB_DEVICE_ATTACHED' "$MANIFEST"; then
            sed -i 's#</activity>#    <intent-filter>\n                <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>\n            </intent-filter>\n            <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter"/>\n        </activity>#' "$MANIFEST"
          fi
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<resources><usb-device vendor-id="1208"/></resources>' \
            > android/app/src/main/res/xml/device_filter.xml
          grep -nE 'INTERNET|USB_DEVICE_ATTACHED' "$MANIFEST"

      # Modo quiosque + impressora: substitui o MainActivity gerado pelo que tem
      # lock task (canal 'gogem/kiosk') e registra o UsbPrinterPlugin (canal
      # 'gogem/usb_printer'). Caminho segue --org br.com.dms + gogem_kiosk
      # (= br.com.dms.gogem_kiosk, o MESMO package do campo — atualiza no lugar).
      - name: Instalar MainActivity + plugin USB
        run: |
          DEST=android/app/src/main/kotlin/br/com/dms/gogem_kiosk
          mkdir -p "$DEST"
          cp tool/kiosk_mainactivity.kt "$DEST/MainActivity.kt"
          cp tool/kiosk_usbprinter.kt "$DEST/UsbPrinterPlugin.kt"
          echo "MainActivity + UsbPrinterPlugin instalados em $DEST"

      - name: Build APK (armeabi-v7a + arm64)
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --dart-define=GOGEM_API_URL=${{ inputs.api_url }}
          --dart-define=GOGEM_DEV_JWT=${{ inputs.dev_jwt }}
          --dart-define=GOGEM_PRINTER=usb

      - name: Publicar APKs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogem-totem-apk
          path: apps/kiosk/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
