name: Build APK (totem)

# Gera o APK do totem (app Flutter) sob demanda, sem precisar de SDK Android
# local. Dispare em Actions → "Build APK (totem)" → Run workflow, informando a
# URL da API publicada e um JWT de gestor (temporário, vale ~12h — até o
# pareamento de dispositivo existir). Baixe o APK nos "Artifacts" do run.
#
# APK UNIVERSAL: um único `app-release.apk` com armeabi-v7a + arm64 num arquivo
# só. Serve pra frota mista (32 e 64-bit) — publique 1 arquivo / 1 versionCode
# no Console → Versões e cada aparelho instala a parte que precisa. (O
# /kiosk/latest devolve 1 APK por versionCode, sem distinguir ABI — por isso o
# arquivo tem que carregar as duas.)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL base da API (ex.: https://api.gogem.com.br/api/v1)'
        required: true
        default: 'https://api.gogem.com.br/api/v1'
      dev_jwt:
        description: 'OPCIONAL: JWT de gestor p/ pular o pareamento (dev). Em produção deixe VAZIO — o totem pareia no 1º boot (Frota).'
        required: false
        default: ''
      perfil:
        description: 'Perfil do build. producao = totem real (cartão na maquininha MP Point, impressora USB, quiosque travado). teste = celular (cartão aprova sozinho, impressora fake sem travas de papel/tampa, quiosque DESLIGADO).'
        required: true
        default: 'producao'
        type: choice
        options:
          - producao
          - teste

jobs:
  apk:
    name: Flutter build apk (release, universal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk
    steps:
      - uses: actions/checkout@v4

      # Esconde o JWT dos logs (injetado no build via --dart-define). Depois do
      # checkout: o working-directory do job (apps/kiosk) já existe. Pulado
      # quando vazio (produção pareia no 1º boot, sem JWT).
      - name: Mascarar segredo nos logs
        if: ${{ inputs.dev_jwt != '' }}
        run: echo "::add-mask::${{ inputs.dev_jwt }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A mesma versão exata do ci.yml (ERR-038): o APK sai com o SDK que o CI testou.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Pub get
        run: flutter pub get

      # As pastas de plataforma não são versionadas (ver ci.yml): geramos o
      # scaffold Android on-demand. Não toca em lib/ nem em pubspec.
      - name: Gerar projeto Android
        run: flutter create --platforms=android --org br.com.dms .

      # `flutter create` NÃO declara INTERNET no manifesto principal (só nos de
      # debug/profile). Sem isso o APK de release não alcança a API. Injeta a
      # permissão como filha de <manifest>, antes de <application>. E declara o
      # intent-filter USB_DEVICE_ATTACHED + meta-data (device_filter) DENTRO da
      # <activity>, para o Android conceder a permissão da Epson ao plugar.
      - name: Permitir internet + impressora USB (release)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          if ! grep -q 'USB_DEVICE_ATTACHED' "$MANIFEST"; then
            sed -i 's#</activity>#    <intent-filter>\n                <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"/>\n            </intent-filter>\n            <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter"/>\n        </activity>#' "$MANIFEST"
          fi
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<resources><usb-device vendor-id="1208"/></resources>' \
            > android/app/src/main/res/xml/device_filter.xml
          grep -nE 'INTERNET|USB_DEVICE_ATTACHED' "$MANIFEST"

      # O totem abre o GoGeM sozinho ao ligar e volta para ele depois de um
      # travamento: o app é a TELA INICIAL do Android (HOME), como manda o
      # ANDROID-KIOSK.md (ERR-046 — sem isso, quem abria ao ligar era o
      # Gototem). Só no perfil producao: no celular de teste seria trocar a
      # tela inicial do aparelho da pessoa. Na instalação, definir o GoGeM
      # como tela inicial: cmd package set-home-activity (ver ANDROID-KIOSK.md).
      - name: GoGeM como tela inicial do totem (produção)
        if: ${{ inputs.perfil == 'producao' }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.intent.category.HOME' "$MANIFEST"; then
            sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.HOME"/>\n                <category android:name="android.intent.category.DEFAULT"/>#' "$MANIFEST"
          fi
          if ! grep -q 'android.intent.category.HOME' "$MANIFEST"; then
            echo "::error::Não achei a categoria LAUNCHER no manifesto gerado — o GoGeM não viraria a tela inicial do totem."
            exit 1
          fi
          grep -nE 'category\.(LAUNCHER|HOME|DEFAULT)' "$MANIFEST"

      # Canais nativos: substitui o MainActivity gerado pelo de tool/, a única
      # fonte (quiosque, atualizador, TEF), e registra o UsbPrinterPlugin (canal
      # 'gogem/usb_printer'). Caminho segue --org br.com.dms + gogem_kiosk
      # (= br.com.dms.gogem_kiosk, o MESMO package do campo — atualiza no lugar).
      - name: Instalar MainActivity + plugin USB
        run: |
          DEST=android/app/src/main/kotlin/br/com/dms/gogem_kiosk
          mkdir -p "$DEST"
          cp tool/kiosk_mainactivity.kt "$DEST/MainActivity.kt"
          cp tool/kiosk_usbprinter.kt "$DEST/UsbPrinterPlugin.kt"
          echo "MainActivity + UsbPrinterPlugin instalados em $DEST"

      # Assinatura com a CHAVE DO GOGEM (a mesma do build-play-aab.yml). Sem
      # isto o Flutter assina o release com a chave de DEPURAÇÃO, que o runner
      # cria nova a cada build: nenhuma versão instala por cima da anterior,
      # nem pelo ADB nem pela Distribuição (ERR-045, LIC-038). Falha fechado
      # sem os secrets.
      - name: Configurar assinatura (chave do GoGeM)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente — o APK sairia com a chave de depuração (ver docs/publicar-google-play.md)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          GRADLE=android/app/build.gradle.kts
          printf '%s\n' \
            'import java.util.Properties' \
            'val keystoreProperties = Properties().apply {' \
            '    val f = rootProject.file("key.properties")' \
            '    if (f.exists()) f.inputStream().use { load(it) }' \
            '}' \
            "$(cat "$GRADLE")" > "$GRADLE"
          perl -0pi -e 's/(android \{)/$1\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }/' "$GRADLE"
          perl -0pi -e 's/signingConfigs\.getByName\("debug"\)/signingConfigs.getByName("release")/' "$GRADLE"
          echo "== build.gradle.kts (trecho de assinatura) ==" && grep -nE "signingConfig|keystoreProperties" "$GRADLE" || true

      # Perfil → defines. producao = totem (maquininha/impressora/quiosque);
      # teste = celular (tudo fake, SEM travas de papel/tampa, quiosque OFF).
      - name: Build APK universal (v7 + arm64 num arquivo só)
        run: |
          if [ "${{ inputs.perfil }}" = "teste" ]; then
            PAY=fake; PRN=fake; KIOSK=false
          else
            PAY=mppoint; PRN=usb; KIOSK=true
          fi
          echo "perfil=${{ inputs.perfil }} → PAY=$PAY PRN=$PRN KIOSK=$KIOSK"
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=GOGEM_API_URL=${{ inputs.api_url }} \
            --dart-define=GOGEM_DEV_JWT=${{ inputs.dev_jwt }} \
            --dart-define=GOGEM_PRINTER=$PRN \
            --dart-define=GOGEM_PAYMENT_PROVIDER=$PAY \
            --dart-define=GOGEM_KIOSK_LOCK=$KIOSK

      # Portão (LIC-038): APK com a chave de depuração, ou com uma chave que não
      # é a do GoGeM, NÃO sai do build. A impressão digital é pública (é a do
      # certificado, não um segredo).
      - name: Conferir a assinatura do APK (chave do GoGeM)
        env:
          CERT_ESPERADO: 6b42eb2d08d21007426e80019df4024b1f173751d2964e00d47e34a1fa607b1e
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BT/apksigner" verify --print-certs "$APK" > certs.txt
          cat certs.txt
          if grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::APK assinado com a chave de DEPURAÇÃO — não distribua (LIC-038)."
            exit 1
          fi
          if ! grep -q "SHA-256 digest: $CERT_ESPERADO" certs.txt; then
            echo "::error::APK assinado com uma chave que não é a do GoGeM (esperada $CERT_ESPERADO)."
            exit 1
          fi
          echo "Assinatura conferida: chave do GoGeM."

      # Portão (ERR-050): o APK saía sem o canal do atualizador e o do TEF, e a
      # falha só aparecia no totem, calada.
      - name: Conferir os canais nativos no APK
        run: |
          unzip -p build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' > canais.dex
          for CANAL in gogem/kiosk gogem/usb_printer gogem/updater gogem/tef; do
            if ! grep -aq "$CANAL" canais.dex; then
              echo "::error::APK sem o canal nativo $CANAL (ERR-050)."
              exit 1
            fi
            echo "ok: $CANAL"
          done

      - name: Publicar APK universal como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogem-totem-apk-${{ inputs.perfil }}
          path: apps/kiosk/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
