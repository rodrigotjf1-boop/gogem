name: gogem_kiosk
description: "GoGeM - app de autoatendimento (totem) by DMS"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Tektur-OFL.txt
  fonts:
    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur-Regular.ttf
        - asset: assets/fonts/Tektur-Medium.ttf
          weight: 600
