name: gogem_kiosk
description: "GoGeM - app de autoatendimento (totem) by DMS"
publish_to: "none"
version: 0.5.21+26

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  cached_network_image: ^3.4.1
  package_info_plus: ^8.0.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  # Atualização pela Google Play (In-App Update): detecta versão nova e pede
  # autorização. Só nos builds do Play; sideload usa o updater próprio.
  in_app_update: ^4.2.3
  gogem_escpos:
    path: ../../packages/escpos
  gogem_payment:
    path: ../../packages/payment
  # Windows (totem em PC — F13). sqflite não tem plugin desktop: usamos o
  # sqflite_common_ffi (+ sqlite3 nativo empacotado). win32/ffi = impressão RAW
  # pela fila do Windows (winspool). window_manager = tela cheia (desktop-only,
  # não registra no Android). Tudo guardado por Platform.isWindows no runtime.
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  win32: ^5.5.0
  ffi: ^2.1.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Gera os ícones do launcher (mipmaps + adaptive icon) a partir do PNG da marca.
  # Rodar: dart run flutter_launcher_icons  (após salvar assets/branding/gogem-1024.png)
  flutter_launcher_icons: ^0.14.1

# Ícone do app (Android). Fonte = logo 1024x1024 da marca.
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/branding/gogem-1024.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0E1613"
  adaptive_icon_foreground: "assets/branding/gogem-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Tektur-OFL.txt
  fonts:
    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur-Regular.ttf
        - asset: assets/fonts/Tektur-Medium.ttf
          weight: 600
