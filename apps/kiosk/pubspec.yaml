name: gogem_kiosk
description: "GoGeM - app de autoatendimento (totem) by DMS"
publish_to: "none"
version: 0.3.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  gogem_escpos:
    path: ../../packages/escpos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Tektur-OFL.txt
  fonts:
    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur-Regular.ttf
        - asset: assets/fonts/Tektur-Medium.ttf
          weight: 600
